<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Flies that learn find him 90% of the time. Flies that can't: 12%</title>
<desc id="desc">Over 100 rounds, the share of each fly's last 10 rounds in which it found the striped guy, averaged over 10 flies per group. Flies that learn pass 80% by round 9 and find him 90% of the time over rounds 51 to 100. Identical flies that can't learn find him 12% of the time.</desc>
